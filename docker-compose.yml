version: "3.9"

services:

  backend:
    build: .
    container_name: coreapi_backend
    restart: always

    env_file:
      - .env.development

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn CoreAPI.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    expose:
      - "8000"
    environment:
      DEBUG: "0"
      DB_NAME: coredb
      DB_USER: coreuser
      DB_PASSWORD: corepassword
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_volume:/app/static
      # - media_volume:/app/media

  postgres:
    image: postgres:17
    container_name: coreapi_postgres
    restart: always
    environment:
      POSTGRES_DB: coredb
      POSTGRES_USER: coreuser
      POSTGRES_PASSWORD: corepassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coreapi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: coreapi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    container_name: coreapi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      # - media_volume:/app/media
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: